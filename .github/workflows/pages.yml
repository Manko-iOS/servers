name: Publish catalog
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      # Rebuild current modules while retaining historical published versions.
      - name: Prepare generated output for verification
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, rmSync} from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/versioning.json', 'utf8'));
          for (const entry of manifest.sources) rmSync(`dist/${entry.extension.moduleURL}`);
          JS
      - run: npm test
      - run: npm run check
      - run: npm run publish:dry-run
      - run: npm run verify:generated
      # Publish the reviewed immutable modules, preserving their versions and hashes.
      - name: Restore reviewed publication artifacts
        run: git restore --source=HEAD -- dist && npm run verify:generated
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
