name: Verify extensions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      # Rebuild in the ephemeral checkout without overwriting versioned artifacts.
      - name: Prepare generated output for verification
        run: rm -rf dist
      - run: npm test
      - run: npm run check
      - run: npm run publish:dry-run
      - run: npm run verify:generated
