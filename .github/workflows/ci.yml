name: Verify extensions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      # Rebuild current modules while retaining historical published versions.
      - name: Prepare generated output for verification
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, rmSync} from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/versioning.json', 'utf8'));
          for (const entry of manifest.sources) rmSync(`dist/${entry.extension.moduleURL}`);
          JS
      - run: npm test
      - run: npm run check
      - run: npm run publish:dry-run
      - run: npm run verify:generated
